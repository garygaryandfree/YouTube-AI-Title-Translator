<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- 核心SEO标签 -->
  <title>YouTube AI Title Translator - 自动翻译YouTube视频标题的Chrome插件</title>
  <meta name="description" content="基于 OpenAI、Gemini、Claude、DeepSeek、MiniMax、智谱、Kimi 等大模型的 Chrome 浏览器插件，自动将 YouTube 视频标题翻译为自然中文。API Key 仅本地存储，安全开源。">
  
  <!-- Open Graph标签 (社交媒体优化) -->
  <meta property="og:title" content="YouTube AI Title Translator - AI驱动的YouTube标题翻译工具">
  <meta property="og:description" content="智能翻译 YouTube 视频标题，支持 OpenAI、Gemini、Claude、DeepSeek、MiniMax、智谱、Kimi 和自定义端点，保护用户隐私的开源 Chrome 插件。">
  <meta property="og:image" content="https://github.com/garygaryandfree/YouTube-AI-Title-Translator/raw/main/icon/icon128.png">
  <meta property="og:url" content="https://github.com/garygaryandfree/YouTube-AI-Title-Translator">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="YouTube AI Title Translator">
  
  <!-- Twitter Card标签 -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="YouTube AI Title Translator - AI驱动的YouTube标题翻译工具">
  <meta name="twitter:description" content="智能翻译YouTube视频标题，支持多种AI模型的开源Chrome插件。">
  <meta name="twitter:image" content="https://github.com/garygaryandfree/YouTube-AI-Title-Translator/raw/main/icon/icon128.png">
  <meta name="twitter:creator" content="@garygaryandfree">
  
  <!-- 结构化数据 (Schema.org) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "YouTube AI Title Translator",
    "description": "Chrome浏览器插件，基于AI大模型自动翻译YouTube视频标题为中文",
    "applicationCategory": "BrowserExtension",
    "operatingSystem": "Chrome",
    "author": {
      "@type": "Person",
      "name": "Gary"
    },
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "softwareVersion": "1.0.0"
  }
  </script>
  
  <!-- 规范URL -->
  <link rel="canonical" href="https://github.com/garygaryandfree/YouTube-AI-Title-Translator">
  
  <style>
    :root {
      --bg: #f7f8fb;
      --surface: #ffffff;
      --surface-soft: #f9fafc;
      --text: #16181d;
      --muted: #69717f;
      --subtle: #8a93a3;
      --line: #dfe3ea;
      --line-strong: #cbd2dc;
      --red: #ff0033;
      --red-dark: #d9002b;
      --blue: #2868f0;
      --green: #1d9a57;
      --shadow: 0 14px 36px rgba(20, 24, 33, 0.10);
    }

    * { box-sizing: border-box; }

    html {
      scrollbar-width: none;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    body {
      width: 390px;
      margin: 0;
      padding: 0;
      font-family: Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      letter-spacing: 0;
      overflow-y: auto;
      scrollbar-width: none;
    }

    button, input, select {
      font: inherit;
    }

    .app-shell {
      min-height: 100vh;
      background: var(--bg);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 18px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 48px;
      height: 34px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: #fff;
      background: #ff0033;
      border-radius: 8px;
    }

    .brand-mark svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
      transform: translateX(1px);
    }

    h1 {
      margin: 0;
      font-size: 17px;
      line-height: 1.15;
      font-weight: 760;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-subtitle {
      margin-top: 4px;
      font-size: 12px;
      line-height: 1.25;
      color: var(--muted);
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .icon-button {
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: #303640;
      background: var(--surface);
      cursor: pointer;
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }

    .icon-button:hover {
      transform: translateY(-1px);
      border-color: var(--line-strong);
      background: #fdfdfe;
    }

    .icon-button svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    main {
      padding: 14px 18px 12px;
    }

    .master-switch {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .master-switch-copy {
      min-width: 0;
    }

    .master-switch-label {
      display: block;
      font-size: 17px;
      line-height: 1.2;
      font-weight: 760;
      color: var(--text);
    }

    .master-switch-desc {
      display: block;
      margin-top: 5px;
      font-size: 11px;
      line-height: 1.35;
      color: var(--muted);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 58px;
      height: 32px;
      flex: 0 0 auto;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      cursor: pointer;
      background: #b7beca;
      border-radius: 999px;
      transition: background .18s ease;
    }

    .slider:before {
      content: "";
      position: absolute;
      width: 24px;
      height: 24px;
      left: 4px;
      top: 50%;
      background: #fff;
      border-radius: 50%;
      transform: translateY(-50%);
      transition: transform .18s ease;
      border: 1px solid rgba(20, 24, 33, 0.08);
    }

    input:checked + .slider {
      background: var(--red);
    }

    input:checked + .slider:before {
      transform: translate(26px, -50%);
    }

    .section {
      margin-bottom: 16px;
    }

    .section-title {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin: 0 0 10px;
      font-size: 17px;
      line-height: 1.25;
      font-weight: 760;
      color: var(--text);
    }

    .section-title span {
      font-size: 12px;
      font-weight: 650;
      color: var(--subtle);
    }

    label, .field-label, .mini-label {
      display: block;
      margin: 0 0 8px;
      font-size: 13px;
      line-height: 1.25;
      font-weight: 650;
      color: #4d5562;
    }

    .provider-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 0;
    }

    .provider-card {
      position: relative;
      min-height: 72px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 4px;
      text-align: center;
      color: #49515d;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      cursor: pointer;
      transition: color .16s ease, background .16s ease, box-shadow .16s ease;
    }

    .provider-card:hover {
      color: var(--text);
      background: var(--surface-soft);
    }

    .provider-card.active {
      color: var(--red);
      background: #fff;
      box-shadow: inset 0 0 0 2px var(--red);
      z-index: 1;
    }

    .provider-card.active::after {
      content: "";
      position: absolute;
      top: 8px;
      right: 8px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--red);
    }

    .provider-card.active::before {
      content: "";
      position: absolute;
      top: 12px;
      right: 12px;
      width: 7px;
      height: 4px;
      border-left: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(-45deg);
      z-index: 2;
    }

    .p-icon {
      width: 28px;
      height: 24px;
      display: grid;
      place-items: center;
      color: currentColor;
      font-size: 0;
    }

    .p-icon svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 2.1;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .brand-logo {
      display: block;
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    #card-openai .brand-logo {
      width: 30px;
      object-fit: cover;
      object-position: left center;
    }

    .p-icon .filled,
    .p-icon .brand-fill {
      fill: currentColor;
      stroke: none;
    }

    #card-deepseek .p-icon {
      color: #2563eb;
    }

    #card-openai .p-icon {
      color: #20242a;
    }

    #card-google .p-icon {
      color: #4f46e5;
    }

    #card-anthropic .p-icon {
      color: #2d241f;
    }

    #card-minimax .p-icon {
      color: var(--red);
    }

    #card-zhipu .p-icon {
      color: #2563eb;
    }

    #card-kimi .p-icon {
      color: #111827;
    }

    #card-custom .p-icon {
      color: #4d5562;
    }

    .p-name {
      display: block;
      width: 100%;
      font-size: 12px;
      line-height: 1.15;
      font-weight: 680;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .input-section, .custom-main-settings {
      margin-bottom: 14px;
    }

    #manualModelSection {
      display: none;
    }

    .custom-main-settings {
      display: none;
      padding: 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .custom-main-settings .mini-group:last-child {
      margin-bottom: 0;
    }

    select#modelSelect,
    input[type="text"],
    input[type="password"] {
      width: 100%;
      min-height: 46px;
      padding: 12px 14px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      outline: none;
      font-size: 14px;
      line-height: 1.35;
      transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
    }

    select#modelSelect {
      appearance: none;
      cursor: pointer;
      padding-right: 42px;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%2369717f' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
      background-repeat: no-repeat;
      background-position: right 14px center;
    }

    input[type="password"],
    .api-key-field input[type="text"] {
      padding-right: 52px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: .02em;
    }

    input::placeholder {
      color: #9aa3b1;
      letter-spacing: 0;
      font-family: inherit;
    }

    select#modelSelect:focus,
    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(40, 104, 240, 0.12);
      background: #fff;
    }

    .api-key-field {
      position: relative;
    }

    .visibility-toggle {
      position: absolute;
      top: 7px;
      right: 7px;
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #4d5562;
      background: #f7f8fb;
      border: 1px solid var(--line);
      border-radius: 8px;
      cursor: pointer;
      transition: background .16s ease, color .16s ease, border-color .16s ease;
    }

    .visibility-toggle:hover {
      color: var(--text);
      background: #fff;
      border-color: var(--line-strong);
    }

    .visibility-toggle svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .help-link {
      margin-top: 8px;
      font-size: 12px;
      line-height: 1.35;
      color: var(--muted);
      text-align: right;
    }

    .help-link a {
      color: var(--blue);
      text-decoration: none;
      font-weight: 650;
    }

    .help-link a:hover {
      text-decoration: underline;
    }

    .mini-group {
      margin-bottom: 14px;
    }

    .mini-input {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      color: #3e4652;
      background: #fbfcfe;
    }

    button#saveBtn {
      width: 100%;
      min-height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px 18px;
      color: #fff;
      background: var(--red);
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      line-height: 1.2;
      font-weight: 760;
      transition: transform .16s ease, filter .16s ease;
    }

    button#saveBtn:hover {
      transform: translateY(-1px);
      filter: brightness(1.02);
    }

    button#saveBtn:active {
      transform: translateY(1px);
    }

    button#saveBtn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #status {
      min-height: 40px;
      margin-top: 10px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 650;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid transparent;
      border-radius: 8px;
    }

    #status:empty {
      display: none;
    }

    .footer {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 12px 18px 12px;
      background: var(--surface);
      border-top: 1px solid var(--line);
    }

    .footer-link {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      text-decoration: none;
      font-size: 13px;
      line-height: 1.2;
      font-weight: 680;
      color: #3f4753;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      transition: transform .16s ease, border-color .16s ease, background .16s ease, color .16s ease;
    }

    .footer-link:hover {
      transform: translateY(-1px);
      border-color: var(--line-strong);
      background: #fbfcfe;
    }

    .link-feedback {
      color: #185bc9;
    }

    .link-donate {
      color: var(--red-dark);
      background: #fff1f3;
      border-color: rgba(255, 0, 51, 0.24);
    }

    .link-donate:hover {
      color: var(--red-dark);
      background: #ffe3e8;
      border-color: rgba(255, 0, 51, 0.36);
    }

    .footer-link svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: 0 0 auto;
    }

    .link-donate svg {
      fill: rgba(255, 0, 51, 0.12);
    }

    .privacy-note {
      padding: 0 18px 14px;
      margin: 0;
      font-size: 10px;
      line-height: 1.35;
      text-align: center;
      color: var(--subtle);
      background: var(--surface);
    }

    @media (max-width: 360px) {
      body { width: 360px; }
      header, main { padding-left: 14px; padding-right: 14px; }
      h1 { font-size: 15px; }
      .provider-card { min-height: 78px; }
      .p-name { font-size: 11px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header>
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M9.6 7.4v9.2l7.1-4.6-7.1-4.6z"/></svg>
        </div>
        <div>
          <h1>YouTube AI Title Translator</h1>
          <div class="brand-subtitle">AI 模型配置中心</div>
        </div>
      </div>
      <div class="header-actions" aria-label="快捷操作">
        <a class="icon-button" href="https://github.com/garygaryandfree/YouTube-AI-Title-Translator" target="_blank" rel="noopener noreferrer" title="打开项目说明" aria-label="打开项目说明">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        </a>
      </div>
    </header>

    <main>
      <div class="master-switch">
        <span class="master-switch-copy">
          <span class="master-switch-label">翻译开关</span>
          <span class="master-switch-desc">在 YouTube 页面上自动翻译视频标题</span>
        </span>
        <label class="switch" aria-label="翻译开关">
          <input type="checkbox" id="masterToggle" checked>
          <span class="slider"></span>
        </label>
      </div>

      <section class="section" aria-labelledby="providerTitle">
        <h2 class="section-title" id="providerTitle">1. 选择 AI 服务商</h2>
        <div class="provider-grid">
          <div class="provider-card" id="card-openai" role="button" tabindex="0">
            <span class="p-icon" aria-hidden="true">
              <img class="brand-logo" src="assets/brands/openai.svg" alt="">
            </span>
            <span class="p-name">OpenAI</span>
          </div>
          <div class="provider-card" id="card-google" role="button" tabindex="0">
            <span class="p-icon" aria-hidden="true">
              <img class="brand-logo" src="assets/brands/google-gemini.svg" alt="">
            </span>
            <span class="p-name">Gemini</span>
          </div>
          <div class="provider-card" id="card-anthropic" role="button" tabindex="0">
            <span class="p-icon" aria-hidden="true">
              <img class="brand-logo" src="assets/brands/claude.svg" alt="">
            </span>
            <span class="p-name">Claude</span>
          </div>
          <div class="provider-card" id="card-deepseek" role="button" tabindex="0">
            <span class="p-icon" aria-hidden="true">
              <img class="brand-logo" src="assets/brands/deepseek.svg" alt="">
            </span>
            <span class="p-name">DeepSeek</span>
          </div>
          <div class="provider-card" id="card-minimax" role="button" tabindex="0">
            <span class="p-icon" aria-hidden="true">
              <img class="brand-logo" src="assets/brands/minimax.svg" alt="">
            </span>
            <span class="p-name">MiniMax</span>
          </div>
          <div class="provider-card" id="card-zhipu" role="button" tabindex="0">
            <span class="p-icon" aria-hidden="true">
              <img class="brand-logo" src="assets/brands/zai.svg" alt="">
            </span>
            <span class="p-name">智谱</span>
          </div>
          <div class="provider-card" id="card-kimi" role="button" tabindex="0">
            <span class="p-icon" aria-hidden="true">
              <img class="brand-logo" src="assets/brands/kimi.png" alt="">
            </span>
            <span class="p-name">Kimi</span>
          </div>
          <div class="provider-card" id="card-custom" role="button" tabindex="0">
            <span class="p-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="m8 9-4 3 4 3"/><path d="m16 9 4 3-4 3"/><path d="m14 5-4 14"/></svg>
            </span>
            <span class="p-name">自定义</span>
          </div>
        </div>
      </section>

      <section class="section" aria-labelledby="modelTitle">
        <h2 class="section-title" id="modelTitle">2. 模型配置 <span>Model</span></h2>
        <div class="input-section" id="modelSection">
          <label for="modelSelect">模型版本</label>
          <select id="modelSelect"></select>
        </div>
        <div class="input-section" id="manualModelSection">
          <div id="manualModelNameSlot"></div>
        </div>

        <div class="custom-main-settings" id="customMainSettings">
          <label>自定义接口</label>
          <div id="customApiUrlSlot">
            <div class="mini-group" id="apiUrlGroup">
              <span class="mini-label">API 接口地址</span>
              <input type="text" id="apiUrl" class="mini-input">
            </div>
          </div>
          <div id="customModelNameSlot">
            <div class="mini-group" id="modelNameGroup">
              <span class="mini-label">模型名称</span>
              <input type="text" id="modelName" class="mini-input">
            </div>
          </div>
        </div>

        <div class="input-section">
          <label for="apiKey">API Key</label>
          <div class="api-key-field">
